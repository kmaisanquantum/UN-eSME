# ====================================================================
# PgBouncer Production Configuration File
# Location: /etc/pgbouncer/pgbouncer.ini
# ====================================================================

[databases]
# Production application database - Enforces high-performance Transaction Pooling
app_db = host=postgres-db port=5432 dbname=production_db auth_user=postgres_app_user pool_mode=transaction

# Dedicated database alias for migrations and schema updates - Enforces Session Pooling
migration_db = host=postgres-db port=5432 dbname=production_db auth_user=postgres_app_user pool_mode=session

[pgbouncer]
# --------------------------------------------------------------------
# Administrative Settings
# --------------------------------------------------------------------
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

# --------------------------------------------------------------------
# Network Configuration
# --------------------------------------------------------------------
listen_addr = *
listen_port = 6432

# --------------------------------------------------------------------
# Authentication Configuration
# --------------------------------------------------------------------
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# --------------------------------------------------------------------
# Connection Pool Tuning (The Core Strategy)
# --------------------------------------------------------------------
# Default pooling mode (used if not explicitly defined in [databases] block)
pool_mode = transaction

# Maximum number of client connections allowed to connect to PgBouncer from Next.js instances
max_client_conn = 1000

# Base size of server connections per database/user combination
default_pool_size = 20

# Minimum number of server connections to keep warm inside the pool
min_pool_size = 5

# Reserve pool size to absorb traffic spikes if the default pool is saturated
reserve_pool_size = 5

# Time (in seconds) client waits for a connection before reserve pool is activated
reserve_pool_timeout = 5

# Strict cap on total server connections across all databases
max_db_connections = 50

# --------------------------------------------------------------------
# Resiliency, Timeouts and Lifetimes (Edge-Case Mitigation)
# --------------------------------------------------------------------
# How long (in seconds) to keep an idle server connection open before closing it
server_idle_timeout = 600

# Maximum lifespan of a server connection (1 hour) to clear database-side memory bloat
server_lifetime = 3600

# Timeout (in seconds) when connecting to the PostgreSQL server
server_connect_timeout = 15

# Delay (in seconds) before retrying login to PostgreSQL server after a failure
server_login_retry = 15

# Automatically abort any query that runs longer than 30 seconds to prevent thread blockages
query_timeout = 30

# Disconnect clients that have been completely idle for more than 30 minutes (1800s)
client_idle_timeout = 1800

# --------------------------------------------------------------------
# TCP Keepalive Settings (Network Integrity)
# --------------------------------------------------------------------
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 5
tcp_keepcnt = 3

# --------------------------------------------------------------------
# Security & TLS Configuration (Production Grade)
# --------------------------------------------------------------------
# Enforce TLS encryption on connections originating from Next.js clients to PgBouncer
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/certs/server.key
client_tls_cert_file = /etc/pgbouncer/certs/server.crt

# Enforce TLS encryption on connections originating from PgBouncer to PostgreSQL Database
server_tls_sslmode = require
server_tls_ca_file = /etc/pgbouncer/certs/ca.crt
